<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <h2>Registrar Nuevo Usuario</h2>
        <form action="insertar.php" method="POST">
            <label>Nombre:</label>
            <input type="text" name="nombre" placeholder="Ej: Fede p: Hola" required>

            <label>Correo Electrónico:</label>
            <input type="email" name="email" placeholder="ejemplo@correo.com" required>

            <label>Localidad:</label>
            <input type="text" name="localidad" placeholder="Calle Falsa 123" required>

            <label>Contraseña:</label>
            <input type="contrasenia" name="contrasenia" placeholder="Yquiencoñoesfede" required>

            <label>Teléfono:</label>
            <input type="numeroTLF" name="numeroTLF" placeholder="123456789" required>
            <button type="submit">Guardar en Base de Datos</button>
        </form>
    </div>
</body>
</html>
